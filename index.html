  <style>
    /* ==========================================================================
       EVOSPORT MASTER DESIGN SYSTEM (EXACT 1-TO-1 SLIDE MATCH)
       ========================================================================== */
    :root {
      --bg-dark: #05070e;
      --bg-card: rgba(13, 18, 30, 0.85);
      --bg-card-hover: rgba(22, 30, 48, 0.98);
      
      /* Pantone Brand Colors */
      --cyan: #00b4d8;
      --neon-cyan: #00f2fe;
      --magenta: #ff2d78;
      --pink: #e024c3;
      --lime: #c8ff3d;
      --orange: #ff8c00;
      --white: #ffffff;
      --text-muted: #9ca3af;
      
      --border-subtle: rgba(255, 255, 255, 0.1);
      --font-heading: 'Unbounded', sans-serif;
      --font-body: 'Inter', sans-serif;
      --container-max: 1200px;
    }

    .page-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      background-color: var(--bg-dark);
      overflow-x: hidden;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--white);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.5;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    button {
      cursor: pointer;
      font-family: inherit;
      border: none;
      outline: none;
      background: none;
    }

    .container {
      width: 100%;
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 0 24px;
      position: relative;
    }

    /* Section Tags & Headings */
    .section-tag {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-heading);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--lime);
      margin-bottom: 12px;
    }
    .section-tag::before {
      content: '';
      display: inline-block;
      width: 20px;
      height: 3px;
      background: linear-gradient(90deg, var(--neon-cyan), var(--lime));
      border-radius: 2px;
    }

    .section-title {
      font-family: var(--font-heading);
      font-size: 38px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.5px;
      line-height: 1.15;
      margin-bottom: 16px;
    }

    .section-desc {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.6;
      max-width: 680px;
    }

    .text-gradient-lime {
      color: var(--lime);
    }

    .text-gradient-pink {
      color: var(--magenta);
    }

    .text-gradient-mix {
      background: linear-gradient(90deg, #ff2d78 0%, #c8ff3d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ==========================================================================
       0. HEADER (EXACT 1-TO-1 OFFICIAL LOGO ON DARK BG)
       ========================================================================== */
    .header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #05070e;
      border-bottom: 1px solid var(--border-subtle);
      padding: 16px 0;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      height: 40px;
    }

    .brand-logo img {
      height: 40px;
      width: auto;
      display: block;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
      list-style: none;
    }

    .nav-links a {
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      transition: color 0.2s ease;
    }
    .nav-links a:hover {
      color: var(--white);
    }

    .header-btn {
      padding: 8px 18px;
      font-family: var(--font-heading);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      border: 1px solid rgba(255, 45, 120, 0.6);
      color: var(--white);
      border-radius: 6px;
      background: rgba(255, 45, 120, 0.08);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s ease;
    }
    .header-btn:hover {
      background: var(--magenta);
      color: #fff;
    }

    .burger-btn {
      display: none;
      width: 36px;
      height: 36px;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.05);
      border-radius: 6px;
    }
    .burger-btn span {
      display: block;
      width: 20px;
      height: 2px;
      background: var(--white);
    }

    .mobile-drawer {
      position: fixed;
      top: 73px;
      left: 0;
      width: 100%;
      background: rgba(5, 7, 14, 0.98);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 24px;
      display: none;
      flex-direction: column;
      gap: 16px;
      z-index: 999;

    .mobile-drawer.active {
      display: flex;
    }
    .mobile-drawer a {
      font-family: var(--font-heading);
      font-size: 13px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-subtle);
    }

    
    /* ==========================================================================
       1. HERO SECTION (EXACT 1-TO-1 MATCH TO SLIDE 1 PRESENTATION)
       ========================================================================== */
    .hero-section {
      position: relative;
      background-color: #05070e;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 20px 20px;
      overflow: hidden;
    }

    .hero-container {
      position: relative;
      width: 100%;
      min-height: 580px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Court photo in exact proportion and positioning */
    .hero-court-backdrop {
      position: absolute;
      top: -15px;
      right: -20px;
      width: 720px;
      height: 520px;
      background-image: url('images/hero_court_raw.jpg');
      background-size: cover;
      background-position: center right;
      z-index: 1;
      pointer-events: none;
      mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,0.3) 18%, #000000 38%);
      -webkit-mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,0.3) 18%, #000000 38%);
    }

    .hero-content {
      max-width: 580px;
      position: relative;
      z-index: 10;
      margin-bottom: 20px;
    }

    .hero-title {
      font-family: var(--font-heading);
      font-size: 48px;
      font-weight: 900;
      font-style: italic;
      line-height: 1.02;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: -1px;
    }

    .hero-subtext {
      color: #9ca3af;
      font-size: 14px;
      line-height: 1.45;
      margin-bottom: 24px;
      font-weight: 400;
    }

    /* 5 Benefit Badges with vertical separators like Slide 1 */
    .hero-benefits-row {
      display: flex;
      align-items: stretch;
      margin-bottom: 28px;
      max-width: 480px;
    }

    .hero-benefit-item {

      align-items: center;

      gap: 8px;
      padding: 0 12px;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      flex: 1;
    }
    .hero-benefit-item:first-child {
      padding-left: 0;
    }
    .hero-benefit-item:last-child {
      border-right: none;
      padding-right: 0;
    }

    .hero-benefit-item svg {
      width: 24px;
      height: 24px;
    }

    .hero-benefit-label {
      font-size: 8.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      line-height: 1.25;
      color: #cbd5e1;
    }

    /* 2 Slide 1 Action Buttons */
    .hero-buttons-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-hero-primary {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(90deg, #ff2d78 0%, #c8ff3d 100%);
      border: none;
      border-radius: 8px;
      padding: 5px 22px 5px 5px;
      color: #05070e;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255, 45, 120, 0.35);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .btn-hero-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(200, 255, 61, 0.45);
    }

    .btn-hero-calendar-badge {
      width: 36px;
      height: 36px;
      background: #ff2d78;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .btn-hero-text {
      font-family: var(--font-heading);
      font-size: 11.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #05070e;
      white-space: nowrap;
    }

    .btn-hero-secondary {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(13, 18, 30, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 13px 22px;
      color: var(--white);
      font-family: var(--font-heading);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      backdrop-filter: blur(10px);
      transition: all 0.25s ease;
    }
    .btn-hero-secondary:hover {
      border-color: var(--neon-cyan);
      background: rgba(0, 242, 254, 0.1);
      transform: translateY(-2px);
    }

    /* Bottom 5 Sports Bar with Exact Top-Down Centered Layout */
    .hero-bottom-container {
      position: relative;
      margin-top: 25px;
      z-index: 5;
      width: 100%;
    }

    .splash-img-left {
      position: absolute;
      left: -40px;
      bottom: -22px;
      width: 250px;
      height: auto;
      pointer-events: none;
      z-index: 1;
      display: block;
    }

    .splash-img-right {
      position: absolute;
      right: -40px;
      bottom: -22px;
      width: 250px;
      height: auto;
      pointer-events: none;
      z-index: 1;
      display: block;
    }

    
    .sports-bar-exact-box {
      position: relative;
      z-index: 2;
      border-radius: 18px;
      background: #05070e;
      padding: 12px 14px;
      border: 1.5px solid transparent;
      background-image: linear-gradient(#05070e, #05070e), linear-gradient(90deg, #00b4d8 0%, #ff2d78 28%, #c8ff3d 52%, #00b4d8 78%, #ff2d78 100%);
      background-origin: border-box;
      background-clip: padding-box, border-box;
      box-shadow: 0 0 25px rgba(0, 180, 216, 0.2), 0 10px 40px rgba(0, 0, 0, 0.8);
    }

    .sports-bar-clickable-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      z-index: 3;
    }
    .sports-bar-clickable-grid a {
      display: block;
      width: 100%;
      height: 100%;
      transition: background 0.2s ease;
    }
    .sports-bar-clickable-grid a:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .sports-bar {
      position: relative;
      z-index: 2;
      background: rgba(8, 12, 22, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      padding: 18px 10px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.7);
    }

    .sports-bar-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 14px;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
    }
    .sports-bar-item:last-child {
      border-right: none;
    }

    .sports-bar-icon-wrap {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    .sports-bar-icon-wrap svg {
      width: 38px;
      height: 38px;
    }

    .sports-bar-title {
      font-family: var(--font-heading);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 4px;
    }

    .sports-bar-desc {
      font-size: 9px;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      line-height: 1.25;
    }

    
    /* ==========================================================================
       2. 5 ИГР. МНОГО ЭМОЦИЙ (SLIDE 2: EXACT 1-TO-1 MATCH)
       ========================================================================== */
    .games-section {
      position: relative;
      background-color: #05070e;
      padding: 50px 20px 60px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .games-header {
      text-align: center;
      margin-bottom: 36px;
    }

    .games-top-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 12px;
    }

    .games-top-line::before {
      content: '';
      display: block;
      width: 100px;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, #00b4d8);
    }
    .games-top-line::after {
      content: '';
      display: block;
      width: 100px;
      height: 1.5px;
      background: linear-gradient(90deg, #c8ff3d, transparent);
    }

    .games-badge-text {
      font-family: var(--font-heading);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #c8ff3d;
    }

    .games-title {
      font-family: var(--font-heading);
      font-size: 42px;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }

    .games-subtitle {
      color: #9ca3af;
      font-size: 13.5px;
      line-height: 1.5;
      max-width: 600px;
      margin: 0 auto;
    }

    /* 2-Tier Grid: 3 cards top, 2 cards bottom */
    .games-grid-top {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 18px;
    }

    .games-grid-bottom {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .game-card-exact {
      background: #060912;
      border-radius: 16px;
      padding: 14px 14px 18px;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .game-card-exact:hover {
      transform: translateY(-4px);
    }

    /* Color borders matching each sport in Slide 2 */
    .game-card-cyan {
      border: 1.2px solid rgba(0, 180, 216, 0.45);
      box-shadow: 0 4px 20px rgba(0, 180, 216, 0.1);
    }
    .game-card-cyan:hover {
      box-shadow: 0 8px 30px rgba(0, 180, 216, 0.25);
    }

    .game-card-magenta {
      border: 1.2px solid rgba(255, 45, 120, 0.45);
      box-shadow: 0 4px 20px rgba(255, 45, 120, 0.1);
    }
    .game-card-magenta:hover {
      box-shadow: 0 8px 30px rgba(255, 45, 120, 0.25);
    }

    .game-card-lime {
      border: 1.2px solid rgba(200, 255, 61, 0.45);
      box-shadow: 0 4px 20px rgba(200, 255, 61, 0.1);
    }
    .game-card-lime:hover {
      box-shadow: 0 8px 30px rgba(200, 255, 61, 0.25);
    }

    .game-card-img-box {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 14px;
      position: relative;
    }

    .game-card-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }
    .game-card-exact:hover .game-card-img-box img {
      transform: scale(1.03);
    }

    /* Aspect ratios: top row ~16/10, bottom row ~16/9 */
    .games-grid-top .game-card-img-box {
      height: 190px;
    }
    .games-grid-bottom .game-card-img-box {
      height: 220px;
    }

    .game-card-body {
      padding: 0 4px;
    }

    .game-card-title {
      font-family: var(--font-heading);
      font-size: 14px;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .game-card-desc {
      color: #9ca3af;
      font-size: 12px;
      line-height: 1.45;
    }
