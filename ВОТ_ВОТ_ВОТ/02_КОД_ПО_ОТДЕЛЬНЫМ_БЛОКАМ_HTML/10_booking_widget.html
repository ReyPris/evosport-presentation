<!-- ========================================================
     10. Онлайн-виджет бронирования
     EVOSPORT CLEAN TILDA BLOCK
======================================================== -->
<section id="booking-widget" class="section" style="background:#070a14; padding:95px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line);">
  <div class="wrap" style="max-width:860px;">
    
    <div style="text-align:center; margin-bottom:36px;">
      <div style="font-size:12px; font-weight:800; color:var(--lime); text-transform:uppercase; letter-spacing:0.12em; margin-bottom:8px;">БЫСТРОЕ БРОНИРОВАНИЕ В 1 КЛИК</div>
      <h2 style="font-family:'Unbounded'; font-size:clamp(26px, 3.8vw, 42px); text-transform:uppercase; margin-bottom:14px; font-weight:900; line-height:1.18;">
        ЗАБРОНИРОВАТЬ КОРТ <span style="color:var(--lime);">ОНЛАЙН</span>
      </h2>
      <p style="color:var(--text-sub); font-size:15.5px; line-height:1.6;">
        Выберите параметры игры, система мгновенно рассчитает стоимость и зафиксирует слот.
      </p>
    </div>

    <div style="background:#0d1222; border:1px solid rgba(255,255,255,0.12); border-radius:28px; padding:40px; box-shadow:0 25px 60px rgba(0,0,0,0.7);">
      
      <form id="courtBookingForm" onsubmit="handleBookingSubmit(event)">
        
        <!-- 1. SPORT SELECTOR -->
        <div style="margin-bottom:28px;">
          <label style="display:block; font-family:'Unbounded'; font-size:12px; font-weight:800; color:var(--text-sub); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:12px;">1. Вид спорта</label>
          <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:12px;" class="grid-3">
            <button type="button" class="sport-select-btn active" onclick="setBookingSport(this, 'padel', 2400)">Падел</button>
            <button type="button" class="sport-select-btn" onclick="setBookingSport(this, 'pickleball', 1600)">Пиклбол</button>
            <button type="button" class="sport-select-btn" onclick="setBookingSport(this, 'tennis', 3000)">Большой теннис</button>
          </div>
        </div>

        <!-- 2. DATE & DURATION -->
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:28px;" class="grid-2">
          <div>
            <label style="display:block; font-family:'Unbounded'; font-size:12px; font-weight:800; color:var(--text-sub); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:12px;">2. Дата игры</label>
            <input type="date" id="bookDate" required class="booking-input">
          </div>
          <div>
            <label style="display:block; font-family:'Unbounded'; font-size:12px; font-weight:800; color:var(--text-sub); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:12px;">Длительность</label>
            <select id="bookDuration" onchange="updateBookingTotal()" class="booking-input" style="cursor:pointer;">
              <option value="1">1 час игры</option>
              <option value="1.5">1.5 часа игры (+50%)</option>
              <option value="2" selected>2 часа игры (х2)</option>
              <option value="3">3 часа игры (Турнирный блок)</option>
            </select>
          </div>
        </div>

        <!-- 3. TIME SLOTS -->
        <div style="margin-bottom:28px;">
          <label style="display:block; font-family:'Unbounded'; font-size:12px; font-weight:800; color:var(--text-sub); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:12px;">3. Выберите время начала</label>
          <div style="display:grid; grid-template-columns:repeat(6, 1fr); gap:10px;" class="grid-6">
            <button type="button" class="slot-btn" onclick="selectSlot(this, '08:00')">08:00</button>
            <button type="button" class="slot-btn" onclick="selectSlot(this, '10:30')">10:30</button>
            <button type="button" class="slot-btn" onclick="selectSlot(this, '13:00')">13:00</button>
            <button type="button" class="slot-btn" onclick="selectSlot(this, '16:30')">16:30</button>
            <button type="button" class="slot-btn active" onclick="selectSlot(this, '19:00')">19:00</button>
            <button type="button" class="slot-btn" onclick="selectSlot(this, '21:30')">21:30</button>
          </div>
        </div>

        <!-- 4. CONTACT DETAILS -->
        <div style="margin-bottom:28px;">
          <label style="display:block; font-family:'Unbounded'; font-size:12px; font-weight:800; color:var(--text-sub); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:12px;">4. Ваши контакты</label>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;" class="grid-2">
            <input type="text" id="bookName" placeholder="Ваше имя" required class="booking-input">
            <input type="tel" id="bookPhone" placeholder="+7 (___) ___-__-__" required class="booking-input">
          </div>
        </div>

        <!-- РАСЧЕТ СТОИМОСТИ -->
        <div style="display:flex; justify-content:space-between; align-items:center; padding:16px 22px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:14px; margin-bottom:28px;">
          <div>
            <span style="color:var(--text-sub); font-size:13px;">Расчётная стоимость:</span>
            <div id="bookingSummaryDetails" style="font-size:12.5px; color:var(--text-dim); margin-top:3px;">Падел / 2 часа / 19:00</div>
          </div>
          <div style="font-family:'Unbounded'; font-size:26px; font-weight:900; color:var(--lime);" id="bookingTotalCalc">4 800 ₽</div>
        </div>

        <button type="submit" class="btn-evo btn-evo-lime" style="width:100%; padding:18px; font-size:14px; letter-spacing:0.04em;">Подтвердить бронирование корта</button>
      </form>

      <div id="bookingSuccess" style="display:none; text-align:center; padding:30px 0;">
        <div style="width:60px; height:60px; border-radius:50%; background:rgba(200,255,61,0.15); border:2px solid var(--lime); display:flex; align-items:center; justify-content:center; margin:0 auto 20px;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--lime)" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <h3 style="font-size:24px; text-transform:uppercase; color:var(--lime); margin-bottom:12px; font-family:'Unbounded'; font-weight:900;">Корт успешно забронирован!</h3>
        <p id="bookingSuccessText" style="color:var(--text-sub); font-size:16px; margin-bottom:24px; line-height:1.6;"></p>
        <button class="btn-evo btn-evo-outline" onclick="resetBookingForm()">Забронировать еще один слот</button>
      </div>
    </div>
  </div>
</section>
